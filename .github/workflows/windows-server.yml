name: Windows Server - RDP Only

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 0
    
    steps:
      - uses: actions/checkout@v4

      # ============================================
      # 1. INSTALL NETBIRD (LATEST VERSION)
      # ============================================
      - name: Install NetBird
        shell: pwsh
        run: |
          Write-Host "📥 Fetching latest NetBird release..."
          $release = Invoke-WebRequest -Uri "https://api.github.com/repos/netbirdio/netbird/releases/latest" -UseBasicParsing | ConvertFrom-Json
          $asset = $release.assets | Where-Object { $_.name -like "*windows_amd64.msi" } | Select-Object -First 1
          $NetBirdUrl = $asset.browser_download_url
          Invoke-WebRequest -Uri $NetBirdUrl -OutFile "$env:TEMP\netbird.msi" -UseBasicParsing
          Start-Process msiexec -Wait -ArgumentList "/i `"$env:TEMP\netbird.msi`" /quiet /norestart"
          Write-Host "✅ NetBird installed"

      # ============================================
      # 2. CONNECT NETBIRD
      # ============================================
      - name: Connect NetBird
        env:
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
        shell: pwsh
        run: |
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          netbird up --setup-key $env:NETBIRD_SETUP_KEY
          Start-Sleep -Seconds 10
          netbird status

      # ============================================
      # 3. ENABLE RDP
      # ============================================
      - name: Enable RDP
        shell: pwsh
        run: |
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Write-Host "✅ RDP enabled"

      # ============================================
      # 4. FIND ADMIN ACCOUNT & SET PASSWORD
      # ============================================
      - name: Setup Admin Account
        shell: pwsh
        run: |
          $adminUser = Get-LocalUser | Where-Object { $_.SID -like "S-1-5-21-*-500" } | Select-Object -First 1
          if ($adminUser) { $adminName = $adminUser.Name } else { $adminName = "Administrator" }
          $Password = ConvertTo-SecureString "Root@2024!" -AsPlainText -Force
          Set-LocalUser -Name $adminName -Password $Password
          Enable-LocalUser -Name $adminName
          echo "ADMIN_USER=$adminName" >> $env:GITHUB_ENV

      # ============================================
      # 5. INSTALL 7-ZIP (OFFICIAL)
      # ============================================
      - name: Install 7-Zip
        shell: pwsh
        run: |
          $url = "https://www.7-zip.org/a/7z2409-x64.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\7zip.exe" -UseBasicParsing
          Start-Process -FilePath "$env:TEMP\7zip.exe" -ArgumentList "/S" -Wait
          Write-Host "✅ 7-Zip installed"

      # ============================================
      # 6. GET NETBIRD IP
      # ============================================
      - name: Get NetBird IP
        shell: pwsh
        run: |
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          $status = netbird status
          $ipLine = $status -split "`n" | Where-Object { $_ -match "NetBird IP:" -and $_ -notmatch "IPv6" } | Select-Object -First 1
          $NetBirdIP = ($ipLine -split "NetBird IP:")[1].Trim().Split("/")[0].Split(" ")[0]
          Write-Host "📡 NetBird IP: $NetBirdIP"
          echo "NETBIRD_IP=$NetBirdIP" >> $env:GITHUB_ENV

      # ============================================
      # 6.5 MASTER PROXY STEP (check -> create OR route)
      # ============================================
      - name: Configure NetBird Reverse Proxy (gitwin)
        env:
          NETBIRD_API_KEY: ${{ secrets.NETBIRD_API_KEY }}
        shell: pwsh
        run: |
          $token = $env:NETBIRD_API_KEY
          $base  = "https://api.netbird.io"
          $h     = @{ Authorization = "Bearer $token"; Origin = "https://app.netbird.io"; Referer = "https://app.netbird.io/" }

          $svcName  = "gitwin.rs4.indevs.in"
          $destIp   = $env:NETBIRD_IP
          $destPort = 3389
          $mode     = "tcp"

          Write-Host "=== MASTER PROXY STEP ==="
          Write-Host "Runner IP: $destIp"

          # ---------- 1. wait for peer online ----------
          $tid = $null; $waited = 0
          while ($waited -lt 90) {
              try {
                  $peers = @(Invoke-RestMethod -Uri "$base/api/peers" -Headers $h)
                  $myPeer = $peers | Where-Object { $_.ip -contains $destIp } | Select-Object -First 1
                  if ($myPeer -and $myPeer.connected -eq $true) { $tid = ([string[]]$myPeer.id)[0]; break }
              } catch {}
              Write-Host "waiting for peer... 5s"
              Start-Sleep -Seconds 5; $waited += 5
          }
          if (-not $tid) { throw "Peer $destIp not connected!" }
          Write-Host "Peer OK: $tid" -ForegroundColor Green

          # ---------- helpers ----------
          function Get-Svc {
              try { Invoke-RestMethod -Uri "$base/api/reverse-proxies/services/$existingId" -Headers $h -Method GET -ErrorAction Stop } catch { $null }
          }
          function Test-Routed {
              $s = Get-Svc
              if (-not $s) { return $false }
              foreach ($t in @($s.targets)) { if ([string]$t.host -eq $destIp) { return $true } }
              return $false
          }
          function New-Target {
              [ordered]@{ enabled=$true; host=$destIp; port=[int]$destPort; protocol=$mode; target_type="peer"; target_id=$tid; options=[pscustomobject]@{} }
          }

          # ---------- 2. exists? ----------
          $allSvcs  = @(Invoke-RestMethod -Uri "$base/api/reverse-proxies/services" -Headers $h)
          $existing = $allSvcs | Where-Object { $_.name -eq $svcName -or $_.domain -eq $svcName } | Select-Object -First 1

          $needCreate = $false
          $pinPort = $null

          if (-not $existing) {
              Write-Host "Service not found -> will CREATE" -ForegroundColor Yellow
              $needCreate = $true
          } else {
              $existingId = ([string[]]$existing.id)[0]
              $ta = @($existing.targets)
              $currentHost = $null; $oldTid = $null; $oldListen = $null
              if ($ta.Count -gt 0) { $currentHost = [string]$ta[0].host; $oldTid = [string]$ta[0].target_id }
              if ($existing.PSObject.Properties['listen_port']) { $oldListen = $existing.listen_port }
              Write-Host "Found service $existingId | target=$currentHost | public port=$oldListen" -ForegroundColor Cyan

              if (Test-Routed) {
                  Write-Host "✅ Already routed to $destIp. Nothing to do." -ForegroundColor Green
              } else {
                  Write-Host "⚠️ Old target. Routing to $destIp..." -ForegroundColor Yellow
                  $newTarget = New-Target
                  $updated = $false

                  # S1: PUT full body
                  $b1 = ($existing | ConvertTo-Json -Depth 12) | ConvertFrom-Json
                  foreach ($k in @('id','meta')) { if ($b1.PSObject.Properties[$k]) { $b1.PSObject.Properties.Remove($k) } }
                  $b1.targets = @( $newTarget )
                  try {
                      Invoke-RestMethod -Uri "$base/api/reverse-proxies/services/$existingId" -Headers $h -Method PUT -ContentType "application/json; charset=utf-8" -Body ($b1 | ConvertTo-Json -Depth 12) -ErrorAction Stop | Out-Null
                      Start-Sleep -Seconds 2
                      if (Test-Routed) { $updated = $true; Write-Host "✅ Routed via S1 (PUT full)." -ForegroundColor Green }
                      else { Write-Host "S1 ignored." -ForegroundColor Yellow }
                  } catch { Write-Host "S1 failed: $($_.ErrorDetails.Message)" -ForegroundColor Red }

                  # S2: targets sub-API (POST new + remove old)
                  if (-not $updated) {
                      try {
                          Invoke-RestMethod -Uri "$base/api/reverse-proxies/services/$existingId/targets" -Headers $h -Method POST -ContentType "application/json; charset=utf-8" -Body ($newTarget | ConvertTo-Json -Depth 6) -ErrorAction Stop | Out-Null
                          Write-Host "S2: new target POSTed." -ForegroundColor Cyan
                          if ($oldTid) {
                              try { Invoke-RestMethod -Uri "$base/api/reverse-proxies/services/$existingId/targets/$oldTid" -Headers $h -Method DELETE -ErrorAction Stop | Out-Null; Write-Host "S2: old target removed." -ForegroundColor Cyan } catch { Write-Host "S2: old target remove skipped." -ForegroundColor Yellow }
                          }
                          Start-Sleep -Seconds 2
                          if (Test-Routed) { $updated = $true; Write-Host "✅ Routed via S2 (targets sub-API)." -ForegroundColor Green }
                      } catch { Write-Host "S2 failed: $([int]$_.Exception.Response.StatusCode) $($_.ErrorDetails.Message)" -ForegroundColor Red }
                  }

                  # S3: delete old target first, then PUT full
                  if (-not $updated -and $oldTid) {
                      try {
                          Invoke-RestMethod -Uri "$base/api/reverse-proxies/services/$existingId/targets/$oldTid" -Headers $h -Method DELETE -ErrorAction Stop | Out-Null
                          Write-Host "S3: old target deleted." -ForegroundColor Cyan
                          Invoke-RestMethod -Uri "$base/api/reverse-proxies/services/$existingId" -Headers $h -Method PUT -ContentType "application/json; charset=utf-8" -Body ($b1 | ConvertTo-Json -Depth 12) -ErrorAction Stop | Out-Null
                          Start-Sleep -Seconds 2
                          if (Test-Routed) { $updated = $true; Write-Host "✅ Routed via S3 (delete target + PUT)." -ForegroundColor Green }
                      } catch { Write-Host "S3 failed: $([int]$_.Exception.Response.StatusCode) $($_.ErrorDetails.Message)" -ForegroundColor Red }
                  }

                  # S4: LAST RESORT - recreate, keep same public port
                  if (-not $updated) {
                      Write-Host "⚠️ S1-S3 failed. LAST RESORT: recreate, keep public port $oldListen" -ForegroundColor Yellow
                      try { Invoke-RestMethod -Uri "$base/api/reverse-proxies/services/$existingId" -Headers $h -Method DELETE -ErrorAction SilentlyContinue | Out-Null } catch {}
                      $needCreate = $true
                      $pinPort = $oldListen
                  }
              }
          }

          # ---------- 3. create (retry until healthy) ----------
          if ($needCreate) {
              $attempt = 1
              while ($true) {
                  Write-Host "CREATE attempt $attempt ..."
                  $tgt = New-Target
                  $body = [ordered]@{
                      name=$svcName; domain=$svcName; mode=$mode; enabled=$true; private=$false
                      pass_host_header=$false; rewrite_redirects=$false; terminated=$false
                      proxy_cluster="eu1.netbird.services"; auth=[pscustomobject]@{}
                      port_auto_assigned=$true; targets=@($tgt)
                  }
                  if ($pinPort) { $body.port_auto_assigned = $false; $body.listen_port = [int]$pinPort }
                  $json = $body | ConvertTo-Json -Depth 10

                  $newId = $null
                  try {
                      $r = Invoke-RestMethod -Uri "$base/api/reverse-proxies/services" -Headers $h -Method POST -ContentType "application/json; charset=utf-8" -Body $json -ErrorAction Stop
                      $newId = ([string[]]$r.id)[0]
                  } catch {
                      Write-Host "POST failed: $($_.ErrorDetails.Message)" -ForegroundColor Red
                      if ($pinPort) { Write-Host "Pinned port busy -> auto port." -ForegroundColor Yellow; $pinPort = $null }
                      Start-Sleep -Seconds 5; $attempt++; continue
                  }

                  Start-Sleep -Seconds 5
                  $status = "error"
                  try {
                      $check = Invoke-RestMethod -Uri "$base/api/reverse-proxies/services/$newId" -Headers $h -Method GET -ErrorAction Stop
                      $status = [string]$check.meta.status
                  } catch {}

                  if ($status -eq "error") {
                      Write-Host "Status ERROR. Removing bad attempt, retrying..." -ForegroundColor Red
                      try { Invoke-RestMethod -Uri "$base/api/reverse-proxies/services/$newId" -Headers $h -Method DELETE -ErrorAction SilentlyContinue | Out-Null } catch {}
                      Start-Sleep -Seconds 5; $attempt++
                  } else {
                      Write-Host "✅ SUCCESS! $svcName -> $destIp`:$destPort (status $status)" -ForegroundColor Green
                      Write-Host "🌐 Public URL: $($check.domain):$($check.listen_port)" -ForegroundColor Cyan
                      break
                  }
              }
          }

      # ============================================
      # 7. CONNECTION INFO
      # ============================================
      - name: Connection Info
        run: |
          echo "=========================================="
          echo "✅ WINDOWS SERVER READY"
          echo "=========================================="
          echo ""
          echo "📡 NetBird IP: ${{ env.NETBIRD_IP }}"
          echo ""
          echo "🖥️ RDP (port 3389):"
          echo "  Address: ${{ env.NETBIRD_IP }}:3389"
          echo "  User: ${{ env.ADMIN_USER }}"
          echo "  Password: Root@2024!"
          echo ""
          echo "📦 Installed: 7-Zip"
          echo ""
          echo "👑 User: ${{ env.ADMIN_USER }} / Password: Root@2024!"
          echo "♾️ Server runs UNLIMITED TIME"
          echo "=========================================="

      # ============================================
      # 8. KEEP ALIVE (UNLIMITED)
      # ============================================
      - name: Keep Alive (Unlimited)
        run: |
          echo "=========================================="
          echo "🚀 WINDOWS SERVER RUNNING"
          echo "=========================================="
          echo ""
          echo "✅ NetBird: CONNECTED"
          echo "✅ RDP: ACTIVE on 3389"
          echo "✅ 7-Zip: INSTALLED"
          echo ""
          echo "♾️ Keeping alive forever..."
          while ($true) { Start-Sleep -Seconds 60 }
